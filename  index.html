<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seja Cherry</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap">
<style>
:root{--bg:#f9eae8;--ink:#3a1a20;--mut:#8a6a70;--rose:#7a0c1c;--rose2:#5c0814;--line:#f0d3d0;--gold:#c9a06a;--card:#fff;--ok:#3f8f5f;--bad:#b3463f}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Jost,system-ui,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:999px;padding:.6em 1.2em;background:var(--rose);color:#fff}
button:hover{background:var(--rose2)}button.ghost{background:transparent;color:var(--rose2);border:1px solid var(--line)}
button.bad{background:var(--bad)}button.ok{background:var(--ok)}button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--rose2);outline-offset:2px}
input,select,textarea{width:100%;padding:.65em .8em;border:1px solid var(--line);border-radius:10px;background:#fff;margin:.25em 0 .8em}
label{font-size:.85rem;color:var(--mut)}
header{padding:28px 16px 12px;text-align:center}

header p{margin:.2em 0 .8em;color:var(--mut)}
.links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.logo{width:min(300px,78vw);height:auto;display:block;margin:0 auto}
.links a{color:var(--rose2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:.4em 1em;background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:5;scrollbar-width:none}
.chips button{background:#fff;color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.chips button.on{background:var(--rose);color:#fff;border-color:var(--rose)}
main{max-width:1100px;margin:0 auto;padding:8px 16px 120px}
.sec h2{font-size:1.7rem;margin:22px 0 10px;color:var(--rose2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.card img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:#f1e4e7;display:block}
.card .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .n{font-weight:500}.card .p{font-size:1.1rem;color:var(--rose2)}.card .q{font-size:.8rem;color:var(--mut)}
.card button{margin-top:auto}
.fab{position:fixed;right:16px;z-index:20;box-shadow:0 4px 14px #0003}
#cartb{bottom:16px}#wa{bottom:78px;background:#25a85a;padding:.8em 1.1em}
.modal{position:fixed;inset:0;background:#0006;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.row .qty{display:flex;gap:8px;align-items:center}.row .qty button{padding:.2em .7em}
.tabs{display:flex;gap:8px;margin:10px 0}.tabs button{background:#fff;color:var(--ink);border:1px solid var(--line)}.tabs .on{background:var(--rose);color:#fff}
.order{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.order.novo{border-color:var(--rose);box-shadow:0 0 0 3px #7a0c1c33}
.tag{font-size:.75rem;padding:.15em .7em;border-radius:99px;background:var(--line)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.card{position:relative}.badge{position:absolute;top:8px;left:8px;background:var(--rose);color:#fff;font-size:.72rem;letter-spacing:.02em;padding:.3em .8em;border-radius:99px;z-index:2;box-shadow:0 2px 6px #0003}
.slogan{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:1.35rem;color:var(--rose2);margin:10px 16px 12px;text-align:center;text-wrap:balance}
.acct{position:absolute;top:14px;right:14px;background:transparent;color:var(--rose);border:1px solid var(--line);padding:7px 9px;display:flex;flex-direction:column;align-items:center;line-height:1.1;font-size:.7rem}
.acct:hover{background:#fff;color:var(--rose2)}header{position:relative}
.srch{display:flex;gap:8px;max-width:520px;margin:14px auto 0}.srch input{margin:0}
.empty{color:var(--mut);text-align:center;padding:40px 0}
footer{text-align:center;color:var(--mut);padding:20px}
@media(prefers-reduced-motion:no-preference){.order.novo{animation:pulse 1.6s infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 7px #7a0c1c11}}
</style></head><body><div id="app"></div><div id="modal"></div>

function statsView(){
  const now=Date.now(),from=S.period==="hoje"?new Date().setHours(0,0,0,0):S.period==="all"?0:now-(+S.period)*864e5;
  const t=o=>o.acceptedAt||o.createdAt;
  const sold=S.orders.filter(o=>(o.status==="aceito"||o.status==="concluido")&&t(o)>=from);
  const rev=sold.reduce((a,o)=>a+o.total,0),cost=sold.reduce((a,o)=>a+o.items.reduce((b,i)=>b+(i.cost||0)*i.qty,0),0),profit=rev-cost;
  const units=sold.reduce((a,o)=>a+o.items.reduce((b,i)=>b+i.qty,0),0);
  const first=sold.length?Math.min(...sold.map(t)):null;
  const spanDays=S.period==="hoje"?1:S.period==="all"?(first?Math.max(1,Math.ceil((now-first)/864e5)):1):+S.period;
  const acc=S.orders.filter(o=>o.acceptedAt);const avgAcc=acc.length?acc.reduce((a,o)=>a+o.acceptedAt-o.createdAt,0)/acc.length:null;
  const noCost=sold.some(o=>o.items.some(i=>i.cost==null));
  const by={};sold.forEach(o=>o.items.forEach(i=>{const x=by[i.id]||(by[i.id]={name:i.pname||i.name,q:0,r:0,c:0,f:t(o)});x.q+=i.qty;x.r+=i.price*i.qty;x.c+=(i.cost||0)*i.qty;x.f=Math.min(x.f,t(o))}));
  const rows=Object.entries(by).sort((a,b)=>b[1].q-a[1].q);
  const pct=rev?Math.round(profit/rev*100):0;
  const box=(l,v,c)=>`<div class="order" style="margin:0"><small>${l}</small><div style="font-size:1.35rem;font-weight:500;color:${c||"var(--ink)"}">${v}</div></div>`;

  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${box("Valor arrecadado",fmt(rev))}${box("Lucro",fmt(profit),"var(--ok)")}${box("Custos (volta para a loja)",fmt(cost))}${box("Lucro sobre a venda",pct+"%")}${box("Ticket médio",fmt(sold.length?rev/sold.length:0))}${box("Aguardando resposta",S.orders.filter(o=>o.status==="novo").length)}</div>
  <div style="display:flex;height:18px;border-radius:99px;overflow:hidden;margin:14px 0 4px;background:var(--line)"><i style="width:${rev?cost/rev*100:0}%;background:var(--rose)"></i><i style="width:${rev?Math.max(0,profit)/rev*100:0}%;background:var(--ok)"></i></div>
  <small style="color:var(--mut)"><span style="color:var(--rose)">■</span> custos dos produtos, embalagem e taxas &nbsp; <span style="color:var(--ok)">■</span> lucro</small>
  <h3 style="margin:20px 0 6px">Tempo de venda</h3>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${box("Primeira venda",first?new Date(first).toLocaleDateString("pt-BR"):"—")}${box("Média por dia",(sold.length/spanDays).toFixed(1)+" pedidos")}${box("Tempo para aceitar",avgAcc==null?"—":dur(avgAcc))}</div>
  <h3 style="margin:20px 0 6px">Produtos mais vendidos</h3>
  ${rows.length?rows.map(([id,x])=>`<div class="row"><span>${esc(x.name)}<br><small style="color:var(--mut)">${x.q} vendido${x.q>1?"s":""} · 1ª venda há ${dur(now-x.f)}</small></span><span style="text-align:right">${fmt(x.r)}<br><small style="color:var(--ok)">lucro ${fmt(x.r-x.c)}</small></span></div>`).join(""):'<p class="empty">Ainda não há vendas neste período. Pedidos aceitos entram aqui.</p>'}
  ${noCost?'<p style="color:var(--mut);font-size:.85rem">Pedidos feitos antes de cadastrar os custos aparecem com lucro igual ao valor total.</p>':""}`}

function calcPricing(){const f=$("#pf");if(!f)return;const v=k=>+f.elements[k].value||0;
  const base=v("cost")+v("pack")+v("tag")+v("other"),fee=v("fee"),m=v("margin"),den=1-(m+fee)/100,price=v("price");
  const sug=den>0&&base>0?Math.ceil(base/den+.1)-.1:0,cost=base+price*fee/100,lucro=price-cost;
  $("#calc").innerHTML=`Custo total por peça: <b>${fmt(base)}</b><br>`+(sug?`Preço sugerido para ${m}% de lucro: <b>${fmt(sug)}</b> <button type="button" class="ghost" data-act="usesug" data-v="${sug.toFixed(2)}">Usar este preço</button><br>`:(base>0?"Margem + taxa não podem passar de 100%.<br>":""))+
  (price&&base?`Com o preço de ${fmt(price)}: lucro de <b style="color:${lucro<0?"var(--bad)":"var(--ok)"}">${fmt(lucro)}</b> por peça (${(lucro/price*100).toFixed(0)}% do preço)`:"")}
function resize(file){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const m=700,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.78))};im.src=fr.result};fr.readAsDataURL(file)})}

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  if(t.classList.contains("modal")&&e.target!==t)return;
  const a=t.dataset.act,id=t.dataset.id,v=t.dataset.v,k=t.dataset.k;
  if(t.tagName==="A")e.preventDefault();
  if(a==="admin"){S.adminView=true;try{history.replaceState(null,"","#admin")}catch(x){}render();window.scrollTo(0,0);return}
  if(a==="shop"){S.adminView=false;try{history.replaceState(null,"",location.pathname+location.search)}catch(x){}render();window.scrollTo(0,0);return}
  if(a==="usesug"){$("#pf [name=price]").value=v;calcPricing();return}
  if(a==="period"){S.period=v;render();return}
  if(a==="close"){S.after=false;$("#modal").innerHTML="";return}
  if(a==="cat"){S.cat=v;S.pid=null;S.q="";render()}
  if(a==="add"){addCart(id,"",1);render()}
  if(a==="inc"){const[i,vv]=k.split("|");addCart(i,vv||"",1);render();cartModal()}
  if(a==="dec"){S.cart[k]--;if(S.cart[k]<=0)delete S.cart[k];render();cartModal()}
  if(a==="open"){const p=S.products.find(x=>x.id===id);S.pid=id;S.pv=hasVars(p)&&p.vars.length===1&&p.vars[0].q>0?p.vars[0].id:"";S.pq=1;render();window.scrollTo(0,0)}
  if(a==="home"){S.pid=null;$("#modal").innerHTML="";render();window.scrollTo(0,0)}
  if(a==="pvar"){S.pv=v;S.pq=1;render()}
  if(a==="pq"){const mx=stockOf(S.products.find(x=>x.id===S.pid),S.pv);S.pq=Math.min(Math.max(1,mx),Math.max(1,S.pq+ +v));render()}
  if(a==="padd"){const p=S.products.find(x=>x.id===S.pid),k2=S.pv?S.pid+"|"+S.pv:S.pid;if((S.cart[k2]||0)+S.pq>stockOf(p,S.pv))toast("Você já tem todo o estoque disponível na sacola.");else{addCart(S.pid,S.pv,S.pq);toast("Adicionado à sacola");S.pq=1;render()}}
  if(a==="rmcoupon"){S.coupon=null;$("#tot").innerHTML=totalsHtml(subtotal())}
  if(a==="cnew")couponModal("");
  if(a==="cedit")couponModal(id);
  if(a==="ctoggle"){const c=S.coupons.find(x=>x.code===id);await DB.saveCoupon({...c,active:!c.active})}
  if(a==="cdel"&&confirm("Excluir este cupom?")){await DB.delCoupon(id);$("#modal").innerHTML=""}
  if(a==="clearq"){S.q="";render()}
  if(a==="acct"){S.after=false;if(S.admin){S.adminView=true;render();window.scrollTo(0,0)}else authModal("login")}
  if(a==="auth"){S.after=true;authModal(v)}
  if(a==="chpw"){try{await DB.changePassword(S.user)}catch(x){alert(authErr(x))}}
  if(a==="authmode")authModal(v);
  if(a==="logoutc"){await DB.logout();S.user=null;S.admin=false;S.profile=null;$("#modal").innerHTML="";render()}
  if(a==="cart")cartModal();
  if(a==="tab"){S.tab=v;render()}
  if(a==="sound"){actx=actx||new(window.AudioContext||window.webkitAudioContext)();S.sound=!S.sound;if(S.sound)beep();render()}
  if(a==="logout"){await DB.logout();S.adminView=false;render()}
  if(a==="edit")prodModal(id);
  if(a==="del"&&confirm("Excluir este produto?")){await DB.delProduct(id);$("#modal").innerHTML=""}
  if(a==="accept"){const o=S.orders.find(x=>x.id===id);await DB.setOrder(id,{status:"aceito",acceptedAt:Date.now()});if(!o.reserved)for(const i of o.items)await DB.stock(i.id,-i.qty,i.vid)}
  if(a==="refuse"){const o=S.orders.find(x=>x.id===id);if(o.status==="novo"){await DB.setOrder(id,{status:"recusado"});if(o.reserved)for(const i of o.items)await DB.stock(i.id,i.qty,i.vid,-i.qty);if(o.coupon)await DB.couponUses(o.coupon.code,-1)}}
  if(a==="done")await DB.setOrder(id,{status:"concluido"});
});
document.addEventListener("change",e=>{if(e.target.name==="ship")setAddr()});
document.addEventListener("input",async e=>{const t=e.target;if(t.name!=="cep")return;const v=t.value.replace(/\D/g,"").slice(0,8);t.value=v.length>5?v.slice(0,5)+"-"+v.slice(5):v;
  if(v.length===8&&t.form){try{const j=await(await fetch("https://viacep.com.br/ws/"+v+"/json/")).json();if(!j.erro){const F=t.form.elements;if(!F.rua.value)F.rua.value=j.logradouro||"";if(!F.bairro.value)F.bairro.value=j.bairro||"";if(!F.cidade.value)F.cidade.value=(j.localidade||"")+"/"+(j.uf||"")}}catch(x){}}});
document.addEventListener("input",e=>{if(e.target.closest&&e.target.closest("#pf"))calcPricing()});
document.addEventListener("change",async e=>{if(e.target.id==="file"&&e.target.files[0]){const d=await resize(e.target.files[0]);$("#pf [name=img]").value=d;const p=$("#prev");p.src=d;p.style.display="block"}});
document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));
  try{
  if(f.id==="cf"){const code=cc(d.cupom);if(!code)return;try{const c=await DB.getCoupon(code),e=couponOk(c);if(e){$("#cerr").textContent=e;return}S.coupon=c;$("#tot").innerHTML=totalsHtml(subtotal());toast("Cupom aplicado")}catch(x){$("#cerr").textContent="Não foi possível verificar o cupom."}}
  if(f.id==="cpf"){const code=cc(d.code);if(!code){alert("Digite um nome para o cupom.");return}const old=S.coupons.find(x=>x.code===code);
    if(!f.dataset.code&&old){alert("Já existe um cupom com esse nome.");return}if(d.type==="percent"&&+d.value>100){alert("A porcentagem não pode passar de 100.");return}
    await DB.saveCoupon({code,type:d.type,value:+d.value,minTotal:+d.minTotal||0,maxUses:+d.maxUses||0,active:!!d.active,uses:old?old.uses||0:0,createdAt:old?old.createdAt:Date.now()});$("#modal").innerHTML=""}
  if(f.id==="sf"){S.q=(d.q||"").trim();S.pid=null;render();window.scrollTo(0,0)}
  if(f.id==="lf"||f.id==="rf"){try{
    const u=f.id==="rf"?await DB.register(d.email,d.pw,pickProfile(d)):await DB.login(d.email,d.pw);
    S.user=u;S.admin=isAdm(u);if(S.admin){S.adminView=true;S.after=false;$("#modal").innerHTML="";render();window.scrollTo(0,0);return}
    S.profile=f.id==="rf"?pickProfile(d):((await DB.profile(u))||S.profile);
    render();if(S.after){S.after=false;cartModal()}else{$("#modal").innerHTML="";toast("Você está conectada")}}
    catch(x){$("#aerr").textContent=authErr(x)}}
  if(f.id==="pff"){const pr=pickProfile(d);await DB.saveProfile(S.user,pr);S.profile={...S.profile,...pr};render();$("#modal").innerHTML="";toast("Dados salvos")}
  if(f.id==="co"){const sh=CONFIG.shipping.find(o=>o.id===d.ship),pay=CONFIG.payments.find(o=>o.id===d.pay);
    const need=!!sh.addr;
    const items=Object.entries(S.cart).map(([k,q])=>{const[id,v]=k.split("|"),p=S.products.find(x=>x.id===id);return{id,vid:v||"",pname:p.name,name:p.name+(v?" ("+COLORS[v].n+")":""),price:p.price,qty:q,cost:Math.round(unitCost(p)*100)/100}});
    const sub=items.reduce((a,i)=>a+i.price*i.qty,0),{d:disc}=calcCoupon(sub);const ord={createdAt:Date.now(),status:"novo",uid:S.user.uid,email:S.user.email,customer:{name:d.name,phone:d.phone,address:need?fmtAddr(d):"Retirada na loja",notes:d.notes},shipping:{label:sh.label},payment:{id:pay.id,label:pay.label},items,subtotal:sub,coupon:S.coupon&&disc>0?{code:S.coupon.code,type:S.coupon.type,value:S.coupon.value,discount:disc}:null,total:Math.round((sub-disc)*100)/100};await DB.placeOrder(ord);S.coupon=null;
    const pr=need?pickProfile(d):{name:d.name,phone:d.phone};try{await DB.saveProfile(S.user,pr);S.profile={...S.profile,...pr}}catch(x){}
    S.cart={};render();doneModal(ord)}
  if(f.id==="pf"){const vars=["dourado","prata"].filter(c=>d["v"+c]!=="").map(c=>({id:c,n:COLORS[c].n,q:+d["v"+c]||0}));await DB.saveProduct({id:f.dataset.id||undefined,name:d.name,price:+d.price,qty:vars.length?vars.reduce((a,x)=>a+x.q,0):(+d.qty||0),desc:d.desc||"",vars,sold:((S.products.find(x=>x.id===f.dataset.id)||{}).sold)||0,category:d.category.trim(),img:d.img,cost:+d.cost||0,pack:+d.pack||0,tag:+d.tag||0,other:+d.other||0,fee:+d.fee||0,margin:+d.margin||0,createdAt:+f.dataset.created||Date.now()});$("#modal").innerHTML=""}
  if(f.id==="login"){try{await DB.login(d.email,d.pw)}catch(x){$("#err").textContent=authErr(x)}}
  }catch(x){alert("Não foi possível concluir: "+x.message)}
});
window.addEventListener("hashchange",render);

/* ---------- início ---------- */
(async()=>{
  try{await DB.init()}catch(e){$("#app").innerHTML='<p class="empty">Não foi possível conectar ao Firebase. Confira o firebaseConfig.</p>';return}
  DB.onProducts(p=>{S.products=p;render()});
  let ordersOn=false;DB.onAuth(async u=>{S.user=u;S.admin=isAdm(u);if(!u)S.profile=null;
    if(S.admin&&!ordersOn){ordersOn=true;DB.onOrders(o=>{S.orders=o;render()});DB.onCoupons(c=>{S.coupons=c;render()})}
    render();if(u&&!S.admin){try{const pr=await DB.profile(u);if(pr){S.profile=pr;render()}}catch(e){}}});
})();
</script></body></html>
